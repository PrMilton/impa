<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMPA Exámenes</title>
<style>
:root{--navy:#172554;--blue:#2563eb;--bg:#e9eef4;--paper:#fffdf9;--line:#cfd8e5;--text:#1f2937;--muted:#64748b;--green:#15803d;--red:#b91c1c;--amber:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{background:var(--navy);color:#fff;padding:15px 24px;display:flex;align-items:center;justify-content:space-between}.teacher-title{display:block;border:0;background:transparent;color:#fff;font-size:20px;font-weight:800;padding:0}.institute-link{color:#bfdbfe;text-decoration:none;font-size:13px}.institute-link:hover{text-decoration:underline}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:21px;box-shadow:0 4px 18px #0f172a0d;margin-bottom:17px}.login{max-width:500px;margin:55px auto}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field select,.field textarea{width:100%;min-width:0;padding:10px 11px;border:1px solid #b9c5d5;border-radius:8px;background:#fff}.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid #bfdbfe;border-color:var(--blue)}.btn{border:1px solid #c5cfdd;background:#fff;padding:9px 14px;border-radius:8px;font-weight:750}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.success{background:var(--green);border-color:var(--green);color:#fff}.danger{color:var(--red);border-color:#fecaca}.full{width:100%}.muted{color:var(--muted)}h2{color:var(--navy);letter-spacing:-.02em}.status{display:inline-block;padding:7px 10px;border-radius:999px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:800}.status.offline{background:#fef3c7;color:#92400e}.student-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.tabs .active{background:var(--navy);color:#fff}.category{margin:20px 0}.category-title{display:flex;gap:10px;align-items:center;color:#1e3a8a}.category-title:after{content:"";height:1px;background:#cbd5e1;flex:1}.exam-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border-bottom:1px solid #e2e8f0}.exam-row:last-child{border:0}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}.notice{padding:12px 14px;border-radius:8px;background:#eff6ff;color:#1e40af;margin:12px 0}.warning{background:#fef3c7;color:#92400e}.question{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin:13px 0}.options{display:grid;gap:8px}.option{display:flex;gap:9px;border:1px solid #d5deea;padding:10px;border-radius:8px}.option:has(input:checked){background:#eff6ff;border-color:#60a5fa}.instruction{color:#64748b;background:#f8fafc;border-radius:7px;padding:8px}.timer{font-size:18px;font-weight:900;background:#eff6ff;color:#1e40af;padding:8px 11px;border-radius:8px}.timer.urgent{background:#fee2e2;color:#991b1b}.progress{height:8px;background:#dbe3ef;border-radius:9px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--blue)}.result{text-align:center}.result strong{display:block;font-size:50px;color:var(--navy)}dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 25px 70px #0006}dialog::backdrop{background:#0f172a99}.dialog-card{padding:21px;background:var(--paper)}.builder-meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.builder-question{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 8px 24px #1e3a8a0d;padding:22px}.builder-question:not(.builder-active){display:none}.builder-question.builder-active{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(480px,1.5fr);grid-template-rows:auto auto 1fr;gap:12px 24px}.builder-question>.field:nth-child(1){grid-column:1;grid-row:1}.builder-question>.field:nth-child(2){grid-column:1;grid-row:2}.builder-question>.option-grid{grid-column:2;grid-row:1/4}.builder-question>.field:last-child{grid-column:1;grid-row:3}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.builder-nav{position:sticky;top:8px;z-index:4;background:var(--navy);padding:12px;border-radius:11px;margin:15px 0;box-shadow:0 8px 25px #0f172a2b}.builder-nav-top{display:flex;justify-content:space-between;color:#fff;margin-bottom:9px}.builder-steps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.builder-step{border:1px solid #64748b;background:#334155;color:#e2e8f0;border-radius:7px;padding:8px;font-weight:800}.builder-step.active{background:var(--blue);color:#fff}.builder-step.complete{background:#166534}.builder-step.complete:after{content:" ✓"}.builder-help{background:#eef6ff;border-left:4px solid var(--blue);padding:10px 12px;border-radius:7px}.builder-pager{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.sticky-save{position:sticky;bottom:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 -5px 22px #0f172a12}.message{white-space:pre-wrap}.badge-pending{background:#fef3c7;color:#92400e}.badge-answered{background:#dcfce7;color:#166534}@media(max-width:820px){.builder-question.builder-active{display:block}.builder-meta,.option-grid{grid-template-columns:1fr}.builder-steps{grid-template-columns:repeat(4,1fr)}.exam-row{align-items:flex-start;flex-direction:column}.top{padding:13px}.wrap{margin-top:15px}}
</style></head><body>
<header class="top"><div><button id="teacherAccess" class="teacher-title">IMPA Exámenes</button><a class="institute-link" href="https://prmilton.github.io/impa/gestor.html">Instituto Bíblico</a></div><span id="connection" class="status">Conectando…</span></header>
<main class="wrap">
<section id="accessView" class="card login"><h2>Acceso al examen</h2><p class="muted">Ingresá tu DNI sin puntos.</p><form id="accessForm"><div class="field"><label>Número de DNI</label><input name="dni" inputmode="numeric" required></div><button class="btn primary full">Continuar</button></form><p id="accessError" class="notice warning hidden"></p></section>
<section id="studentView" class="hidden"><div class="card student-head"><div><small class="muted">Alumno</small><h2 id="studentName"></h2><span id="studentDni"></span></div><button class="btn" data-action="logout">Salir</button></div><div id="studentContent"></div></section>
<section id="examView" class="hidden"><div class="card"><div class="student-head"><div><small id="examSubject"></small><h2 id="examTitle"></h2></div><div><span id="examTimer" class="timer"></span> <span id="answerCount" class="status"></span></div></div><div class="progress"><i id="examProgress"></i></div><form id="examForm"><div id="questions"></div><div class="actions"><button type="button" class="btn" data-action="back-student">Cancelar</button><button class="btn success">Entregar examen</button></div></form></div></section>
<section id="teacherView" class="hidden"><div class="tabs"><button class="btn active" data-teacher-tab="exams">Exámenes</button><button class="btn" data-teacher-tab="results">Resultados</button><button class="btn" data-teacher-tab="inbox">Inbox <span id="inboxBadge"></span></button><button class="btn" data-action="logout">Salir</button></div><div id="teacherContent"></div></section>
</main>
<dialog id="teacherDialog"><form id="teacherLogin" class="dialog-card"><h2>Ingreso docente</h2><div class="field"><label>Clave docente</label><input type="password" name="pin" inputmode="numeric" required></div><div class="actions"><button type="button" class="btn" data-close="teacherDialog">Cancelar</button><button class="btn primary">Ingresar</button></div></form></dialog>
<dialog id="questionDialog"><form id="questionForm" class="dialog-card"><h2>Nueva consulta</h2><div class="field"><label>Materia o examen</label><select name="examId"></select></div><div class="field"><label>Asunto</label><input name="asunto" maxlength="100" required></div><div class="field"><label>Consulta</label><textarea name="mensaje" rows="5" maxlength="1200" required></textarea></div><div class="actions"><button type="button" class="btn" data-close="questionDialog">Cancelar</button><button class="btn primary">Enviar</button></div></form></dialog>
<dialog id="replyDialog"><form id="replyForm" class="dialog-card"><input type="hidden" name="messageId"><h2>Responder consulta</h2><div id="replyContext" class="notice"></div><div class="field"><label>Respuesta</label><textarea name="respuesta" rows="6" maxlength="1800" required></textarea></div><div class="actions"><button type="button" class="btn" data-close="replyDialog">Cancelar</button><button class="btn primary">Guardar respuesta</button></div></form></dialog>
<script>
const FS='https://firestore.googleapis.com/v1/projects/formulario-7d5cb/databases/(default)/documents/congregacion_data/mainData',LOCAL='impa_examenes_local_v2',PIN_HASH='1g5syba';
const $=s=>document.querySelector(s),esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let state={students:{},exams:{},attempts:{},messages:{}},cloud=false,student=null,currentExam=null,teacherTab='exams',editingExamId=null,timerHandle=null,connectPromise=null;
function parse(doc,name,fallback={}){try{return JSON.parse(doc.fields?.[name]?.stringValue||'')}catch{return fallback}}
async function request(url,options={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(url,{...options,signal:c.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error(`Firebase ${r.status}: ${await r.text()}`);return r.json()}finally{clearTimeout(t)}}
async function loadCloud(){const d=await request(FS);return{students:parse(d,'instituteStudents'),exams:parse(d,'instituteExams'),attempts:parse(d,'instituteAttempts'),messages:parse(d,'instituteMessages')}}
async function saveField(name,value){return request(`${FS}?updateMask.fieldPaths=${name}`,{method:'PATCH',body:JSON.stringify({fields:{[name]:{stringValue:JSON.stringify(value)}}})})}
async function backup(reason){const d=await request(FS),items=parse(d,'instituteExamBackups',[]);items.unshift({fecha:Date.now(),motivo:reason,exams:parse(d,'instituteExams'),attempts:parse(d,'instituteAttempts')});await saveField('instituteExamBackups',items.slice(0,20))}
async function cloudWrite(type){if(!cloud){localStorage.setItem(LOCAL,JSON.stringify(state));return}if(type==='exams'){await backup('Cambio en exámenes');await saveField('instituteExams',state.exams)}if(type==='attempts'){await backup('Cambio en resultados');await saveField('instituteAttempts',state.attempts)}if(type==='messages')await saveField('instituteMessages',state.messages)}
function setConnection(ok){cloud=ok;$('#connection').textContent=ok?'Conectado ✓':'Sin conexión';$('#connection').classList.toggle('offline',!ok)}
async function connect(){if(connectPromise)return connectPromise;connectPromise=(async()=>{try{state=await loadCloud();setConnection(true)}catch(e){setConnection(false);try{state=JSON.parse(localStorage.getItem(LOCAL))||state}catch{}console.warn(e)}finally{connectPromise=null}})();return connectPromise}
function show(id){['accessView','studentView','examView','teacherView'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function dni(v){return String(v).replace(/\D/g,'')}function subjectKey(v=''){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}function date(v){return v?new Date(v).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'—'}
function attemptsFor(value){const out=[];Object.entries(state.attempts||{}).forEach(([examId,items])=>{if(items?.[value])out.push({examId,...items[value]})});return out}
function renderStudent(){clearInterval(timerHandle);currentExam=null;show('studentView');$('#studentName').textContent=student.nombre;$('#studentDni').textContent='DNI '+student.dni;const done=attemptsFor(student.dni),eligible=Object.entries(state.exams||{}).filter(([,e])=>e.activo&&(!student.materias||student.materias[subjectKey(e.materia)])),groups={};eligible.forEach(x=>(groups[x[1].materia||'Sin materia']??=[]).push(x));const exams=Object.entries(groups).map(([subject,items])=>`<section class="category"><h2 class="category-title">${esc(subject)}</h2><div class="card">${items.map(([id,e])=>{const result=done.find(x=>x.examId===id);return `<div class="exam-row"><div><strong>${esc(e.titulo)}</strong><br>${result?`<span class="status">Entregado · ${result.porcentaje}%</span>`:`<small class="muted">${e.preguntas?.length||7} preguntas · ${e.duracionMinutos||40} minutos</small>`}</div>${result?'':`<button class="btn primary" data-start-exam="${id}">Comenzar</button>`}</div>`}).join('')}</div></section>`).join('')||'<div class="card muted">No hay exámenes habilitados para tus materias.</div>';$('#studentContent').innerHTML=exams+studentInboxHtml()}
function studentInboxHtml(){const items=Object.entries(state.messages||{}).filter(([,m])=>m.dni===student.dni).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));return `<section class="category"><div class="student-head"><h2 class="category-title" style="flex:1">Mis consultas</h2><button class="btn primary" id="newQuestion">+ Nueva consulta</button></div>${items.map(([,m])=>`<article class="card"><span class="status ${m.estado==='Pendiente'?'offline':''}">${esc(m.estado)}</span><h3>${esc(m.asunto)}</h3><small class="muted">${date(m.createdAt)} · ${esc(m.materia||'Consulta general')}</small><p class="message">${esc(m.mensaje)}</p>${m.respuesta?`<div class="notice"><strong>Respuesta docente</strong><p class="message">${esc(m.respuesta)}</p></div>`:'<p class="muted">Esperando respuesta.</p>'}</article>`).join('')||'<div class="card muted">Todavía no enviaste consultas.</div>'}</section>`}
function startExam(id){currentExam={id,...state.exams[id]};show('examView');$('#examSubject').textContent=currentExam.materia;$('#examTitle').textContent=currentExam.titulo;$('#questions').innerHTML=currentExam.preguntas.map((q,i)=>`<article class="question"><h3>${i+1}. ${esc(q.texto)}</h3>${q.instruccion?`<p class="instruction">${esc(q.instruccion)}</p>`:''}<div class="options">${q.opciones.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div></article>`).join('');updateProgress();startTimer(currentExam.duracionMinutos||40)}
function updateProgress(){if(!currentExam)return;const n=$('#examForm').querySelectorAll('input:checked').length,total=currentExam.preguntas.length;$('#answerCount').textContent=`${n} / ${total}`;$('#examProgress').style.width=(n/total*100)+'%'}
function startTimer(minutes){clearInterval(timerHandle);let seconds=Math.round(minutes*60);const tick=()=>{const m=Math.floor(seconds/60),s=seconds%60;$('#examTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('#examTimer').classList.toggle('urgent',seconds<=300);if(seconds--<=0){clearInterval(timerHandle);submitExam({preventDefault(){}},true)}};tick();timerHandle=setInterval(tick,1000)}
async function submitExam(event,forced=false){event.preventDefault();const answers=currentExam.preguntas.map((_,i)=>{const x=$(`input[name="q${i}"]:checked`);return x?Number(x.value):null});if(!forced&&answers.some(x=>x===null)){alert('Respondé todas las preguntas.');return}if(!forced&&!confirm('¿Entregar el examen?'))return;clearInterval(timerHandle);const correct=answers.filter((a,i)=>a===currentExam.preguntas[i].correcta).length,result={respuestas:answers,correctas:correct,total:answers.length,porcentaje:Math.round(correct/answers.length*100),fecha:Date.now(),alumno:student.nombre,tiempoAgotado:forced};state.attempts[currentExam.id]??={};if(state.attempts[currentExam.id][student.dni])return alert('Este examen ya fue entregado.');state.attempts[currentExam.id][student.dni]=result;try{await cloudWrite('attempts');$('#studentContent').innerHTML=`<div class="card result"><span>Resultado</span><strong>${result.porcentaje}%</strong><p>${correct} respuestas correctas de ${answers.length}</p><button class="btn primary" data-action="student-home">Volver</button></div>`;show('studentView')}catch(e){delete state.attempts[currentExam.id][student.dni];alert(e.message)}}
function updateInboxBadge(){const n=Object.values(state.messages||{}).filter(m=>m.estado==='Pendiente').length;$('#inboxBadge').textContent=n?`(${n})`:''}
function renderTeacher(){show('teacherView');document.querySelectorAll('[data-teacher-tab]').forEach(b=>b.classList.toggle('active',b.dataset.teacherTab===teacherTab));updateInboxBadge();if(teacherTab==='inbox')return renderInbox();if(teacherTab==='results')return renderResults();const groups={};Object.entries(state.exams||{}).forEach(x=>(groups[x[1].materia||'Sin materia']??=[]).push(x));$('#teacherContent').innerHTML=`<div class="card"><div class="student-head"><div><h2>Exámenes por materia</h2><p class="muted">Los publicados deben despublicarse antes de editar.</p></div><button class="btn primary" id="newExam">+ Nuevo examen</button></div>${Object.entries(groups).map(([subject,items])=>`<section class="category"><h2 class="category-title">${esc(subject)}</h2>${items.map(([id,e])=>`<div class="exam-row"><div><strong>${esc(e.titulo)}</strong><br><small>${e.preguntas?.length||7} preguntas · ${e.duracionMinutos||40} minutos</small></div><div class="actions"><button class="btn ${e.activo?'success':''}" data-toggle-exam="${id}">${e.activo?'Publicado':'Publicar'}</button>${e.activo?'':`<button class="btn" data-edit-exam="${id}">Editar</button><button class="btn danger" data-delete-exam="${id}">Eliminar</button>`}</div></div>`).join('')}</section>`).join('')||'<p class="muted">No hay exámenes.</p>'}</div><div id="builder"></div>`}
function renderResults(){const rows=[];Object.entries(state.attempts||{}).forEach(([id,items])=>Object.entries(items||{}).forEach(([d,r])=>rows.push(`<tr><td>${esc(r.alumno||state.students[d]?.nombre||'—')}</td><td>${d}</td><td>${esc(state.exams[id]?.titulo||id)}</td><td><strong>${r.porcentaje}%</strong></td></tr>`)));$('#teacherContent').innerHTML=`<div class="card"><h2>Resultados</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>Alumno</th><th>DNI</th><th>Examen</th><th>Nota</th></tr>${rows.join('')||'<tr><td colspan="4">Sin resultados</td></tr>'}</table></div></div><div class="card"><h2>Administrar</h2>${Object.entries(state.exams||{}).map(([id,e])=>`<div class="exam-row"><strong>${esc(e.titulo)}</strong><div><button class="btn" data-report-exam="${id}">Informe</button> <button class="btn danger" data-clear-results="${id}">Limpiar resultados</button> <button class="btn danger" data-delete-complete="${id}">Eliminar completo</button></div></div>`).join('')}</div>`}
function renderInbox(){const items=Object.entries(state.messages||{}).sort((a,b)=>(a[1].estado==='Pendiente'?-1:1)-(b[1].estado==='Pendiente'?-1:1)||(b[1].createdAt||0)-(a[1].createdAt||0));$('#teacherContent').innerHTML=`<div class="student-head"><div><h2>Inbox de consultas</h2><p class="muted">Consultas privadas por DNI.</p></div><button class="btn" id="refreshInbox">Actualizar</button></div>${items.map(([id,m])=>`<article class="card"><span class="status ${m.estado==='Pendiente'?'badge-pending':'badge-answered'}">${esc(m.estado)}</span><h3>${esc(m.asunto)}</h3><small>${esc(m.alumno)} · DNI ${esc(m.dni)} · ${date(m.createdAt)}</small><p class="message">${esc(m.mensaje)}</p>${m.respuesta?`<div class="notice"><strong>Respuesta</strong><p class="message">${esc(m.respuesta)}</p></div>`:''}<div class="actions"><button class="btn primary" data-answer-message="${id}">${m.respuesta?'Editar respuesta':'Responder'}</button><button class="btn" data-close-message="${id}">Cerrar</button><button class="btn danger" data-delete-message="${id}">Eliminar</button></div></article>`).join('')||'<div class="card muted">No hay consultas.</div>'}`}
function renderBuilder(id=null){editingExamId=id;const exam=id?state.exams[id]:null,questions=Array.from({length:7},(_,i)=>`<section class="builder-question"><div class="field"><label>Pregunta ${i+1}</label><input name="text${i}" required></div><div class="field"><label>Instrucción opcional</label><textarea name="instruction${i}" rows="3"></textarea></div><div class="option-grid">${[0,1,2,3].map(j=>`<div><div class="field"><label>Opción ${j+1}</label><input name="o${i}_${j}" required></div><div class="field"><label>Explicación opcional</label><textarea name="explain${i}_${j}" rows="2"></textarea></div></div>`).join('')}</div><div class="field"><label>Respuesta correcta</label><select name="correct${i}">${[0,1,2,3].map(j=>`<option value="${j}">Opción ${j+1}</option>`).join('')}</select></div></section>`).join('');$('#builder').innerHTML=`<form id="builderForm" class="card"><h2>${exam?'Editar borrador':'Nuevo examen'}</h2><div class="builder-meta"><div class="field"><label>Título</label><input name="titulo" required></div><div class="field"><label>Materia</label><select name="materia"><option>Antropología</option><option>Teología</option><option>Soteriología</option><option>Bibliología</option><option>Hamartiología</option></select></div><div class="field"><label>Duración</label><input type="number" name="duracionMinutos" min="1" max="240" value="40"></div></div>${questions}<div class="actions sticky-save"><button type="button" class="btn" id="cancelBuilder">Cancelar</button><button class="btn primary">Guardar borrador</button></div></form>`;const form=$('#builderForm');if(exam){form.elements.titulo.value=exam.titulo||'';form.elements.materia.value=exam.materia||'Antropología';form.elements.duracionMinutos.value=exam.duracionMinutos||40;exam.preguntas.forEach((q,i)=>{form.elements[`text${i}`].value=q.texto||'';form.elements[`instruction${i}`].value=q.instruccion||'';form.elements[`correct${i}`].value=q.correcta??0;q.opciones.forEach((o,j)=>{form.elements[`o${i}_${j}`].value=o||'';form.elements[`explain${i}_${j}`].value=q.explicaciones?.[j]||''})})}setupWizard(form);form.addEventListener('submit',saveExam);form.scrollIntoView({behavior:'smooth'})}
function setupWizard(form){const qs=[...form.querySelectorAll('.builder-question')];let current=0,nav=document.createElement('div');nav.className='builder-nav';nav.innerHTML=`<div class="builder-nav-top"><strong>Preguntas</strong><span id="builderCompletion"></span></div><div class="builder-steps">${qs.map((_,i)=>`<button type="button" class="builder-step" data-step="${i}">${i+1}</button>`).join('')}</div>`;qs[0].before(nav);const help=document.createElement('p');help.className='builder-help';help.innerHTML='<strong>Consejo:</strong> consigna breve, cuatro alternativas claras y una respuesta correcta.';nav.after(help);const pager=document.createElement('div');pager.className='builder-pager';pager.innerHTML='<button type="button" class="btn" id="prevQuestion">← Anterior</button><strong id="questionPosition"></strong><button type="button" class="btn primary" id="nextQuestion">Siguiente →</button>';form.querySelector('.actions').before(pager);const complete=q=>[...q.querySelectorAll('input[required]')].every(x=>x.value.trim()),update=()=>{qs.forEach((q,i)=>{q.classList.toggle('builder-active',i===current);const b=nav.querySelector(`[data-step="${i}"]`);b.classList.toggle('active',i===current);b.classList.toggle('complete',complete(q))});$('#builderCompletion').textContent=`${qs.filter(complete).length} de 7 completas`;$('#questionPosition').textContent=`Pregunta ${current+1} de 7`;$('#prevQuestion').disabled=current===0;$('#nextQuestion').disabled=current===6},go=i=>{current=Math.max(0,Math.min(6,i));update();qs[current].scrollIntoView({behavior:'smooth'})};nav.onclick=e=>{const b=e.target.closest('[data-step]');if(b)go(Number(b.dataset.step))};$('#prevQuestion').onclick=()=>go(current-1);$('#nextQuestion').onclick=()=>go(current+1);form.addEventListener('input',update);update()}
async function saveExam(e){e.preventDefault();const f=new FormData(e.target),id=editingExamId||'ex'+Date.now(),previous=state.exams[id];state.exams[id]={titulo:f.get('titulo'),materia:f.get('materia'),duracionMinutos:Number(f.get('duracionMinutos')),activo:false,preguntas:Array.from({length:7},(_,i)=>({texto:f.get(`text${i}`),instruccion:f.get(`instruction${i}`),opciones:[0,1,2,3].map(j=>f.get(`o${i}_${j}`)),explicaciones:[0,1,2,3].map(j=>f.get(`explain${i}_${j}`)),correcta:Number(f.get(`correct${i}`))}))};try{await cloudWrite('exams');editingExamId=null;renderTeacher()}catch(e){if(previous)state.exams[id]=previous;else delete state.exams[id];alert(e.message)}}
function teacherFingerprint(v){let h=2166136261;for(const c of `IMPA-2026|${v}|DOCENTE`){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
$('#accessForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Buscando…';await connect();const value=dni(new FormData(e.target).get('dni')),s=state.students[value];b.disabled=false;b.textContent='Continuar';if(!s||s.activo===false){$('#accessError').textContent=cloud?'No encontramos ese DNI.':'No hay conexión.';$('#accessError').classList.remove('hidden');return}student={dni:value,...s};renderStudent()};
$('#examForm').onchange=updateProgress;$('#examForm').onsubmit=submitExam;$('#teacherAccess').onclick=()=>$('#teacherDialog').showModal();
$('#teacherLogin').onsubmit=e=>{e.preventDefault();const pin=new FormData(e.target).get('pin');if(teacherFingerprint(pin)!==PIN_HASH)return alert('Clave incorrecta');e.target.reset();$('#teacherDialog').close();renderTeacher()};
$('#questionForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),exam=state.exams[f.get('examId')],id='msg'+Date.now();state.messages[id]={dni:student.dni,alumno:student.nombre,examId:f.get('examId'),materia:exam?.materia||'',examTitle:exam?.titulo||'',asunto:f.get('asunto').trim(),mensaje:f.get('mensaje').trim(),respuesta:'',createdAt:Date.now(),estado:'Pendiente'};try{await cloudWrite('messages');e.target.reset();$('#questionDialog').close();renderStudent()}catch(err){delete state.messages[id];alert(err.message)}};
$('#replyForm').onsubmit=async e=>{e.preventDefault();const id=e.target.elements.messageId.value,m=state.messages[id],previous={...m};m.respuesta=e.target.elements.respuesta.value.trim();m.answeredAt=Date.now();m.estado='Respondida';try{await cloudWrite('messages');e.target.reset();$('#replyDialog').close();renderInbox()}catch(err){state.messages[id]=previous;alert(err.message)}};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close)$('#'+b.dataset.close).close();if(b.dataset.startExam)startExam(b.dataset.startExam);if(b.dataset.teacherTab){teacherTab=b.dataset.teacherTab;renderTeacher()}if(b.id==='newExam')renderBuilder();if(b.dataset.editExam)renderBuilder(b.dataset.editExam);if(b.id==='cancelBuilder'){$('#builder').innerHTML='';editingExamId=null}if(b.dataset.toggleExam){const x=state.exams[b.dataset.toggleExam];x.activo=!x.activo;try{await cloudWrite('exams');renderTeacher()}catch{ x.activo=!x.activo }}if(b.dataset.deleteExam&&!state.exams[b.dataset.deleteExam].activo&&confirm('¿Eliminar borrador?')){const old=state.exams[b.dataset.deleteExam];delete state.exams[b.dataset.deleteExam];try{await cloudWrite('exams');renderTeacher()}catch{state.exams[b.dataset.deleteExam]=old}}if(b.id==='newQuestion'){const select=$('#questionForm').elements.examId;select.innerHTML='<option value="">Consulta general</option>'+Object.entries(state.exams).filter(([,x])=>!student.materias||student.materias[subjectKey(x.materia)]).map(([id,x])=>`<option value="${id}">${esc(x.materia)} · ${esc(x.titulo)}</option>`).join('');$('#questionDialog').showModal()}if(b.dataset.answerMessage){const id=b.dataset.answerMessage,m=state.messages[id],form=$('#replyForm');form.elements.messageId.value=id;form.elements.respuesta.value=m.respuesta||'';$('#replyContext').innerHTML=`<strong>${esc(m.alumno)} · ${esc(m.asunto)}</strong><p>${esc(m.mensaje)}</p>`;$('#replyDialog').showModal()}if(b.dataset.closeMessage){state.messages[b.dataset.closeMessage].estado='Cerrada';await cloudWrite('messages');renderInbox()}if(b.dataset.deleteMessage&&confirm('¿Eliminar consulta?')){delete state.messages[b.dataset.deleteMessage];await cloudWrite('messages');renderInbox()}if(b.id==='refreshInbox'){await connect();renderInbox()}if(b.dataset.clearResults&&confirm('¿Limpiar resultados?')){delete state.attempts[b.dataset.clearResults];await cloudWrite('attempts');renderResults()}if(b.dataset.deleteComplete&&confirm('¿Eliminar examen y resultados?')){delete state.exams[b.dataset.deleteComplete];delete state.attempts[b.dataset.deleteComplete];await cloudWrite('exams');await cloudWrite('attempts');renderResults()}if(b.dataset.reportExam){const exam=state.exams[b.dataset.reportExam],w=window.open('','_blank');w.document.write(`<h1>${esc(exam.titulo)}</h1><h2>${esc(exam.materia)}</h2>`+exam.preguntas.map((q,i)=>`<h3>${i+1}. ${esc(q.texto)}</h3><p><b>Respuesta correcta:</b> ${esc(q.opciones[q.correcta])}</p>`).join(''));w.print()}if(b.dataset.action==='logout'){student=null;currentExam=null;clearInterval(timerHandle);show('accessView')}if(b.dataset.action==='back-student'||b.dataset.action==='student-home')renderStudent()});
connect();setInterval(async()=>{if(!currentExam){await connect();if(student&&!$('#studentView').classList.contains('hidden'))renderStudent();if(teacherTab==='inbox'&&!$('#teacherView').classList.contains('hidden'))renderInbox()}},15000);
</script></body></html>
