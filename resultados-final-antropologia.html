<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IBMEPA · Resultados finales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#172554;--blue:#2563eb;--bg:#eef2f7;--card:#fff;--line:#d8e0eb;--text:#172033;--muted:#64748b;--green:#15803d;--red:#b91c1c;--amber:#b45309}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.hidden{display:none!important}
    header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}header h1{font-size:20px;margin:0}header small{color:#bfdbfe}.wrap{width:min(1180px,calc(100% - 24px));margin:24px auto 60px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 5px 18px #0f172a0c}.access{max-width:460px;margin:10vh auto}.access h2{margin-top:0;color:var(--navy)}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;border:1px solid #bcc8d8;border-radius:9px;padding:11px;background:#fff}.btn{border:1px solid #bcc8d8;background:#fff;border-radius:9px;padding:9px 13px;font-weight:750;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{border-color:#fecaca;color:var(--red)}.muted{color:var(--muted)}.error{color:var(--red);font-weight:700}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{margin:0}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{width:min(360px,80vw)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat strong{display:block;font-size:27px;color:var(--navy)}.stat span{font-size:13px;color:var(--muted)}
    .results{display:grid;gap:12px}.result{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.result h3{margin:0 0 5px;color:var(--navy)}.result p{margin:3px 0}.score{text-align:right}.score strong{display:block;font-size:28px}.pass{color:var(--green)}.fail{color:var(--red)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#e2e8f0}.badge.pass{background:#dcfce7}.badge.fail{background:#fee2e2}.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #edf1f5;padding-top:10px}
    dialog{width:min(900px,calc(100% - 20px));max-height:90vh;border:0;border-radius:15px;padding:0;box-shadow:0 20px 60px #0f172a55}dialog::backdrop{background:#0f172a99}.modal-head{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0;font-size:19px}.modal-actions{display:flex;gap:8px}.modal-actions .btn{white-space:nowrap}.modal-body{padding:20px}.student-data{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;background:#f8fafc;padding:14px;border-radius:10px}.answer-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #e7edf4}.answer-row:last-child{border:0}.answer-row .mark{font-weight:900}.correct{color:var(--green)}.incorrect{color:var(--red)}
    .empty{text-align:center;padding:40px;color:var(--muted)}
    @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.result{grid-template-columns:1fr}.score{text-align:left}.student-data{grid-template-columns:1fr}.answer-row{grid-template-columns:32px 1fr}.answer-row .mark{grid-column:2}.toolbar-actions,.toolbar-actions .btn{width:100%}.modal-head{align-items:flex-start;flex-direction:column}.modal-actions{width:100%}.modal-actions .btn{flex:1;padding:8px 6px;font-size:13px}}
    @media print{body{background:#fff}header,.toolbar,.stats,.results,.modal-head button,.print-hide{display:none!important}dialog{position:static;display:block!important;width:100%;max-height:none;box-shadow:none}dialog::backdrop{display:none}.modal-head{position:static;color:#111;background:#fff;border-bottom:2px solid #111}.modal-body{padding:12px}.answer-row{break-inside:avoid}}
  </style>
</head>
<body>
  <header><div><h1>IBMEPA · Resultados</h1><small>Examen final de Antropología Bíblica</small></div><span>Panel docente</span></header>
  <main class="wrap">
    <section id="accessView" class="card access"><h2>Acceso docente</h2><p class="muted">Ingresá el código para consultar las entregas.</p><form id="accessForm"><label for="pin">Código de acceso</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required><p id="accessError" class="error hidden">Código incorrecto.</p><button class="btn primary" type="submit">Ingresar</button></form></section>
    <section id="panelView" class="hidden">
      <div class="toolbar"><div><h2>Entregas registradas</h2><p id="syncStatus" class="muted">Cargando resultados…</p></div><div class="toolbar-actions"><input id="search" type="search" placeholder="Buscar por nombre, DNI o iglesia"><button id="refresh" class="btn" type="button">Actualizar</button></div></div>
      <div class="stats"><div class="card stat"><strong id="totalCount">0</strong><span>Entregas</span></div><div class="card stat"><strong id="passCount">0</strong><span>Aprobados</span></div><div class="card stat"><strong id="average">0%</strong><span>Promedio</span></div><div class="card stat"><strong id="pendingCount">0</strong><span>Desaprobados</span></div></div>
      <div id="results" class="results"></div>
    </section>
  </main>
  <dialog id="detailDialog"><div class="modal-head"><h2 id="detailTitle">Detalle</h2><div class="modal-actions"><button id="printDetail" class="btn primary" type="button">Imprimir / Guardar PDF</button><button id="closeDetail" class="btn" type="button">Cerrar</button></div></div><div id="detailBody" class="modal-body"></div></dialog>
  <script>
    const FIRESTORE='https://firestore.googleapis.com/v1/projects/ibmepa/databases/(default)/documents';
    const API_KEY='AIzaSyCzfFAbU6zWoWM9vqnxw8gztcvM4xE2Q3Y';
    const PIN_HASH='d76813bb06fdd34e534844a007f3348019dd1c8b5e1b1f37137b84db44d22def';
    const ANSWER_KEY='FVFVFVVFVFVFVFVVVFVF'.split('');
    const PASS_SCORE=15;
    const questions=[
      'La Biblia enseña que el ser humano es producto del azar y de procesos naturales impersonales.',
      'El hombre fue creado a imagen y semejanza de Dios, lo que le otorga una dignidad especial dentro de la creación.',
      'El propósito de Dios para la humanidad surgió después de la creación del mundo.',
      'El ser humano participa en la historia como instrumento mediante el cual Dios desarrolla su plan redentor.',
      'La imagen de Dios en el hombre se refiere principalmente a su forma física.',
      'Después de la caída, la imagen de Dios en el hombre fue afectada pero no destruida completamente.',
      'La naturaleza tripartita sostiene que el hombre está compuesto por cuerpo, alma y espíritu.',
      'La conciencia humana no tiene relación con el juicio moral de las acciones del hombre.',
      'El estado primitivo del hombre estaba caracterizado por la inocencia original y la ausencia de pecado.',
      'El trabajo fue un castigo que apareció solamente después de la caída del hombre.',
      'La tentación llevó al ser humano a dudar de la palabra de Dios y finalmente a desobedecer su mandato.',
      'La caída del hombre no produjo consecuencias en las relaciones humanas ni en la creación.',
      'El pecado puede definirse como rebelión contra Dios y desviación del estándar divino.',
      'El pecado afecta solamente la conducta externa del ser humano y no su interior.',
      'La salvación comienza por la iniciativa de Dios y no por el esfuerzo humano.',
      'La santificación es un proceso progresivo en el que el creyente es transformado por la obra de Dios.',
      'La nueva vida en Cristo implica una transformación espiritual que permite al creyente vivir en comunión con Dios.',
      'La acción del Espíritu Santo en la vida del creyente consiste únicamente en producir emociones espirituales.',
      'La mortalidad se refiere a la condición del cuerpo humano sujeto a la muerte.',
      'El estado intermedio es el momento final en el que el cuerpo glorificado es recibido inmediatamente después de la muerte.'
    ];
    const $=s=>document.querySelector(s);let records=[],activeRecord=null;
    async function sha256(value){const bytes=new TextEncoder().encode(value),hash=await crypto.subtle.digest('SHA-256',bytes);return[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    function fieldValue(field){if(!field)return'';return field.stringValue??field.timestampValue??field.integerValue??field.booleanValue??field.doubleValue??''}
    function parseDocument(doc){const f=doc.fields||{},answers=JSON.parse(fieldValue(f.answers)||'{}'),score=ANSWER_KEY.reduce((sum,correct,i)=>sum+(answers[i+1]===correct?1:0),0);return{id:doc.name.split('/').pop(),nombre:fieldValue(f.nombre),dni:fieldValue(f.dni),iglesia:fieldValue(f.iglesia),pastor:fieldValue(f.pastor),fecha:fieldValue(f.fechaDeclarada),startedAt:fieldValue(f.startedAt),submittedAt:fieldValue(f.submittedAt),certificateIssuedAt:fieldValue(f.certificateIssuedAt),certificateCode:fieldValue(f.certificateCode),timeExpired:Boolean(fieldValue(f.timeExpired)),tabChanges:Number(fieldValue(f.tabChanges)||0),answers,score,percent:Math.round(score/20*100)}}
    async function loadResults(){const status=$('#syncStatus');status.textContent='Cargando resultados…';try{const response=await fetch(`${FIRESTORE}/ibmepa_data?pageSize=300&key=${API_KEY}`);if(!response.ok)throw new Error(await response.text());const data=await response.json();records=(data.documents||[]).filter(doc=>fieldValue(doc.fields?.examId)==='antropologia-final-v1').map(parseDocument).sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));status.textContent=`Actualizado ${new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`;render()}catch(error){status.textContent='No se pudieron consultar los resultados. Revisá las reglas de Firestore.';$('#results').innerHTML='<div class="card empty">Error de conexión con Firestore.</div>'}}
    function render(){const term=$('#search').value.trim().toLocaleLowerCase('es'),shown=records.filter(r=>`${r.nombre} ${r.dni} ${r.iglesia}`.toLocaleLowerCase('es').includes(term)),passed=records.filter(r=>r.score>=PASS_SCORE).length,avg=records.length?Math.round(records.reduce((n,r)=>n+r.percent,0)/records.length):0;$('#totalCount').textContent=records.length;$('#passCount').textContent=passed;$('#pendingCount').textContent=records.length-passed;$('#average').textContent=`${avg}%`;$('#results').innerHTML=shown.length?shown.map(r=>`<article class="card result"><div><h3>${escapeHtml(r.nombre||'Sin nombre')}</h3><p>DNI ${escapeHtml(r.dni)} · ${escapeHtml(r.iglesia||'Sin iglesia')}</p><p class="muted">Entregado ${formatDate(r.submittedAt)} · ${r.tabChanges} cambio${r.tabChanges===1?'':'s'} de pestaña</p></div><div class="score"><strong class="${r.score>=PASS_SCORE?'pass':'fail'}">${r.score}/20</strong><span class="badge ${r.score>=PASS_SCORE?'pass':'fail'}">${r.percent}% · ${r.score>=PASS_SCORE?'Aprobado':'Desaprobado'}</span></div><div class="actions"><button class="btn primary" data-view="${r.id}">Ver informe</button>${r.score>=PASS_SCORE?`<button class="btn" data-certificate="${r.id}">Generar certificado</button>`:''}<button class="btn danger" data-delete="${r.id}">Eliminar entrega</button></div></article>`).join(''):'<div class="card empty">No hay entregas que coincidan con la búsqueda.</div>'}
    function escapeHtml(value){const div=document.createElement('div');div.textContent=value??'';return div.innerHTML}
    function formatDate(value){if(!value)return'Sin fecha';return new Date(value).toLocaleString('es-AR')}
    function showDetail(id){const r=records.find(item=>item.id===id);if(!r)return;activeRecord=r;$('#detailTitle').textContent=`${r.nombre} · ${r.score}/20`;$('#detailBody').innerHTML=`<div class="student-data"><div><strong>DNI</strong><br>${escapeHtml(r.dni)}</div><div><strong>Iglesia</strong><br>${escapeHtml(r.iglesia||'—')}</div><div><strong>Pastor</strong><br>${escapeHtml(r.pastor||'—')}</div><div><strong>Fecha declarada</strong><br>${escapeHtml(r.fecha||'—')}</div><div><strong>Entrega</strong><br>${formatDate(r.submittedAt)}</div><div><strong>Resultado</strong><br><span class="${r.score>=PASS_SCORE?'pass':'fail'}"><strong>${r.score}/20 · ${r.percent}% · ${r.score>=PASS_SCORE?'APROBADO':'DESAPROBADO'}</strong></span></div></div><h3>Corrección pregunta por pregunta</h3>${questions.map((q,i)=>{const answer=r.answers[i+1]||'—',correct=ANSWER_KEY[i],ok=answer===correct;return`<div class="answer-row"><strong>${i+1}</strong><div>${escapeHtml(q)}<br><span class="muted">Respondió: <strong>${answer}</strong> · Correcta: <strong>${correct}</strong></span></div><span class="mark ${ok?'correct':'incorrect'}">${ok?'✓ Correcta':'✕ Incorrecta'}</span></div>`}).join('')}`;$('#detailDialog').showModal()}
    function printDetail(){if(!activeRecord)return;const content=$('#detailBody').cloneNode(true);content.querySelector('.print-hide')?.remove();const printWindow=window.open('','_blank','width=900,height=800');if(!printWindow){alert('El navegador bloqueó la vista de impresión. Habilitá las ventanas emergentes e intentá nuevamente.');return}printWindow.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe · ${escapeHtml(activeRecord.nombre)}</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#172033;margin:0;font-size:12px}.print-toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:center;gap:10px;padding:12px;background:#172554;box-shadow:0 2px 8px #0003}.print-toolbar button{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}.print-now{background:#f4b41a;color:#172033}.close-now{background:#fff;color:#172554}.report{padding:18px}h1{font-size:20px;margin:0 0 3px;color:#172554}h2{font-size:15px;margin:22px 0 8px}.institution{border-bottom:2px solid #172554;padding-bottom:10px;margin-bottom:14px}.muted{color:#64748b}.pass{color:#15803d}.fail{color:#b91c1c}.student-data{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f4f6f9;padding:12px;border-radius:8px}.answer-row{display:grid;grid-template-columns:28px 1fr 90px;gap:8px;padding:8px 0;border-bottom:1px solid #d8e0eb;break-inside:avoid;page-break-inside:avoid}.mark{font-weight:bold}.correct{color:#15803d}.incorrect{color:#b91c1c}@media print{.print-toolbar{display:none!important}.report{padding:0}}</style></head><body><div class="print-toolbar"><button class="print-now" type="button" onclick="window.print()">Imprimir / Guardar PDF</button><button class="close-now" type="button" onclick="window.close()">Cerrar</button></div><main class="report"><div class="institution"><h1>IBMEPA</h1><div>Instituto Bíblico Metodista Pentecostal de Argentina</div><strong>Informe · Examen final de Antropología Bíblica</strong></div>${content.innerHTML}</main></body></html>`);printWindow.document.close();printWindow.focus()}
    function certificateFileName(r){return`Certificado-Antropologia-${(r.nombre||r.dni||'alumno').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'')}.png`}
    async function registerCertificate(r,issuedAt,code){const body={fields:{certificateIssuedAt:{timestampValue:issuedAt.toISOString()},certificateCode:{stringValue:code}}};const url=`${FIRESTORE}/ibmepa_data/${encodeURIComponent(r.id)}?updateMask.fieldPaths=certificateIssuedAt&updateMask.fieldPaths=certificateCode&key=${API_KEY}`;const response=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw new Error(await response.text());r.certificateIssuedAt=issuedAt.toISOString();r.certificateCode=code}
    async function generateCertificate(id){const r=records.find(item=>item.id===id);if(!r||r.score<PASS_SCORE)return;const popup=window.open('','_blank','width=1100,height=760');if(!popup){alert('El navegador bloqueó la vista del certificado. Habilitá las ventanas emergentes e intentá nuevamente.');return}popup.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Generando certificado…</title><style>body{font-family:system-ui;background:#eef2f7;color:#172554;display:grid;place-items:center;min-height:100vh;margin:0}</style></head><body><strong>Generando certificado y registrando su emisión…</strong></body></html>');popup.document.close();try{await document.fonts.load('700 170px Montserrat');const template=new Image();template.src='certificado-antropologia.png';await template.decode();const issuedAt=r.certificateIssuedAt?new Date(r.certificateIssuedAt):new Date(),code=r.certificateCode||`ANT-${issuedAt.getFullYear()}-${r.dni}`,issuedText=`Emitido el ${new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'long',year:'numeric'}).format(issuedAt)} · Registro N.º ${code}`;if(!r.certificateIssuedAt)await registerCertificate(r,issuedAt,code);const canvas=document.createElement('canvas');canvas.width=template.naturalWidth;canvas.height=template.naturalHeight;const ctx=canvas.getContext('2d');ctx.drawImage(template,0,0);const label=`${(r.nombre||'SIN NOMBRE').toLocaleUpperCase('es-AR')} - DNI: ${r.dni}`;let fontSize=Math.round(canvas.width*.026);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#14245c';ctx.font=`700 ${fontSize}px Montserrat, Arial, sans-serif`;const maxWidth=canvas.width*.72;while(ctx.measureText(label).width>maxWidth&&fontSize>64){fontSize-=4;ctx.font=`700 ${fontSize}px Montserrat, Arial, sans-serif`}ctx.fillText(label,canvas.width*.50,canvas.height*.441);ctx.fillStyle='#14245c';ctx.font=`600 ${Math.round(canvas.width*.015)}px Montserrat, Arial, sans-serif`;ctx.fillText(issuedText,canvas.width*.50,canvas.height*.552);const imageUrl=canvas.toDataURL('image/png');const fileName=certificateFileName(r);popup.document.open();popup.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Certificado · ${escapeHtml(r.nombre)}</title><style>@page{size:A4 landscape;margin:0}*{box-sizing:border-box}body{margin:0;background:#1e293b;font-family:system-ui}.toolbar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px;background:#172554}.toolbar button,.toolbar a{border:0;border-radius:8px;padding:10px 16px;font:700 14px system-ui;text-decoration:none;cursor:pointer}.download{background:#f4b41a;color:#172033}.print{background:#2563eb;color:#fff}.close{background:#fff;color:#172554}.preview{display:grid;place-items:center;padding:18px}.preview img{display:block;width:min(1200px,100%);height:auto;box-shadow:0 12px 40px #0008}@media print{.toolbar{display:none}.preview{padding:0}.preview img{width:100%;box-shadow:none}body{background:#fff}}</style></head><body><div class="toolbar"><a class="download" href="${imageUrl}" download="${fileName}">Descargar PNG</a><button class="print" type="button" onclick="window.print()">Imprimir / Guardar PDF</button><button class="close" type="button" onclick="window.close()">Cerrar</button></div><div class="preview"><img src="${imageUrl}" alt="Certificado de ${escapeHtml(r.nombre)}"></div></body></html>`);popup.document.close();popup.focus()}catch(error){popup.close();alert('No se pudo generar o registrar el certificado. Revisá la conexión y los permisos de Firestore.')}}
    async function deleteRecord(id){const r=records.find(item=>item.id===id);if(!r||!confirm(`¿Eliminar definitivamente la entrega de ${r.nombre}? Esto habilitará al DNI ${r.dni} para volver a rendir.`))return;try{const response=await fetch(`${FIRESTORE}/ibmepa_data/${encodeURIComponent(id)}?key=${API_KEY}`,{method:'DELETE'});if(!response.ok)throw new Error(await response.text());records=records.filter(item=>item.id!==id);render()}catch{alert('No se pudo eliminar la entrega. Revisá la conexión y los permisos de Firestore.')}}
    $('#accessForm').addEventListener('submit',async event=>{event.preventDefault();if(await sha256(event.currentTarget.pin.value)!==PIN_HASH){$('#accessError').classList.remove('hidden');return}$('#accessView').classList.add('hidden');$('#panelView').classList.remove('hidden');loadResults()});
    $('#search').addEventListener('input',render);$('#refresh').addEventListener('click',loadResults);$('#closeDetail').addEventListener('click',()=>$('#detailDialog').close());$('#detailDialog').addEventListener('click',event=>{if(event.target===$('#detailDialog'))$('#detailDialog').close();if(event.target.closest('#printDetail'))printDetail()});
    $('#results').addEventListener('click',event=>{const view=event.target.closest('[data-view]'),certificate=event.target.closest('[data-certificate]'),del=event.target.closest('[data-delete]');if(view)showDetail(view.dataset.view);if(certificate)generateCertificate(certificate.dataset.certificate);if(del)deleteRecord(del.dataset.delete)});
  </script>
</body>
</html>
