    <button data-view="inicio" class="active">▣ Inicio</button><button data-view="alumnos">👥 Alumnos</button><div class="subject-label">Materias</div><button data-view="materia" data-subject="antropologia">📘 Antropología</button><button data-view="materia" data-subject="teologia">📗 Teología</button><button data-view="materia" data-subject="soteriologia">📙 Soteriología</button><button data-view="materia" data-subject="bibliologia">📕 Bibliología</button><button data-view="materia" data-subject="hamartiologia">📓 Hamartiología</button><div class="subject-label">Administración</div><button data-view="respaldo">↕ Respaldo</button>

  <main><header><div><button class="btn mobile-menu" id="menuBtn">☰</button> <h2 id="viewTitle" style="display:inline">Panel de control</h2></div><span class="muted">Ciclo 2026</span></header><div id="content" class="container"></div></main>
</div>

<dialog id="managementLogin" style="width:min(430px,calc(100% - 24px))"><form id="managementLoginForm"><div class="modal-head"><h3>Acceso</h3><button type="button" class="close" id="closeManagementLogin">×</button></div><div class="modal-body"><p class="muted">Ingresá el código para abrir IMPA Gestión.</p><div class="field"><label>Código de acceso</label><input type="password" name="pin" inputmode="numeric" autocomplete="current-password" required autofocus></div><div class="modal-actions"><button class="btn primary">Ingresar</button></div></div></form></dialog>

<dialog id="studentDialog"><form id="studentForm"><div class="modal-head"><h3 id="studentDialogTitle">Alumno</h3><button type="button" class="close" data-close="studentDialog">×</button></div><div class="modal-body"><input type="hidden" name="id"><div class="form-grid">
  <div class="field span2"><label>Nombre y apellido</label><input name="nombreCompleto" class="title-case" maxlength="120"></div>
  <div class="field"><label>DNI</label><input name="dni" inputmode="numeric" maxlength="14"></div><div class="field"><label>Teléfono / WhatsApp</label><input name="telefono" inputmode="tel" maxlength="30"></div>
  <div class="field"><label>Ministerio o institución</label><input name="institucion" class="title-case" maxlength="100"></div><div class="field"><label>Localidad</label><input name="localidad" class="title-case" maxlength="80"></div>
  <div class="field"><label>Función</label><select name="rol"><option value="">Sin especificar</option><option>Pastor/a</option><option>Diácono</option><option>Líder</option><option>Laico</option></select></div><label class="check-field"><input type="checkbox" name="autorizado"> Está autorizado</label>
  <div class="field"><label>Estado</label><select name="estado"><option>Activo</option><option>Inactivo</option></select></div>
  <div class="field span2"><label>Observaciones</label><textarea name="observaciones" rows="3" maxlength="500"></textarea></div>
</div><div class="modal-actions"><button type="button" class="btn" data-close="studentDialog">Cancelar</button><button class="btn primary">Guardar</button></div></div></form></dialog>

<dialog id="profileDialog" style="width:min(760px,calc(100% - 24px))"><div class="modal-head"><h3 id="profileTitle">Ficha del alumno</h3><button type="button" class="close" data-close="profileDialog">×</button></div><div id="profileBody" class="modal-body"></div></dialog>

<dialog id="eventDialog"><form id="eventForm"><div class="modal-head"><h3 id="eventDialogTitle">Encuentro</h3><button type="button" class="close" data-close="eventDialog">×</button></div><div class="modal-body"><input type="hidden" name="id"><div class="form-grid">
  <div class="field"><label>Fecha *</label><input type="date" name="fecha" required></div><div class="field"><label>Estado</label><select name="estado"><option value="programado">Programado</option><option value="realizado">Realizado</option><option value="evaluacion">Evaluación</option></select></div>
  <label class="check-field span2"><input type="checkbox" name="shiftLater" checked> Al insertar, desplazar 7 días todos los encuentros posteriores</label>
  <div class="field span2"><label>Referencia de clases *</label><input name="clases_ref" required maxlength="100"></div><div class="field span2"><label>Manual / páginas</label><input name="manual_ref" maxlength="100"></div>
  <div class="field span2"><label>Tema</label><textarea name="tema" rows="3" maxlength="500"></textarea></div><div class="field span2"><label>Enlace de Google Meet (opcional)</label><input type="url" name="meet" placeholder="https://meet.google.com/..."></div>
</div><div class="modal-actions"><button type="button" class="btn" data-close="eventDialog">Cancelar</button><button class="btn primary">Guardar</button></div></div></form></dialog>

<script>
const IMPA_FS_DOC='https://firestore.googleapis.com/v1/projects/ibmepa/databases/(default)/documents/ibmepa_data/main';
async function impaRequest(url,options={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(url,{...options,signal:controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok)throw new Error(`Firestore ${response.status}: ${await response.text()}`);return response.json()}finally{clearTimeout(timeout)}}
function impaParse(doc,name,fallback){const raw=doc?.fields?.[name]?.stringValue;if(typeof raw!=='string')return fallback;try{return JSON.parse(raw)}catch{return fallback}}
window.loadImpaAcademicData=async function(){const doc=await impaRequest(IMPA_FS_DOC);return window.impaAcademicData={exams:impaParse(doc,'instituteExams',{}),attempts:impaParse(doc,'instituteAttempts',{})}}
async function saveInstituteStudents(value){return impaRequest(`${IMPA_FS_DOC}?updateMask.fieldPaths=instituteStudents`,{method:'PATCH',body:JSON.stringify({fields:{instituteStudents:{stringValue:JSON.stringify(value)}}})})}
async function saveInstituteManagement(value){return impaRequest(`${IMPA_FS_DOC}?updateMask.fieldPaths=instituteManagement`,{method:'PATCH',body:JSON.stringify({fields:{instituteManagement:{stringValue:JSON.stringify(value)}}})})}
let impaManagementRevision=0,impaManagementTimer=null,impaManagementLoading=false;
window.queueImpaManagementSave=function(){clearTimeout(impaManagementTimer);impaManagementTimer=setTimeout(async()=>{const data=window.getImpaManagementData?.();if(!data)return;const envelope={updatedAt:Date.now(),data};impaManagementRevision=envelope.updatedAt;try{await Promise.all([saveInstituteManagement(envelope),saveInstituteStudents(window.getImpaFirebaseStudents())]);console.info('IMPA Gestión sincronizada con Firebase')}catch(err){console.error('No se pudo guardar IMPA Gestión:',err)}},500)};
async function loadImpaManagement(){if(impaManagementLoading)return;impaManagementLoading=true;try{const doc=await impaRequest(IMPA_FS_DOC),remote=impaParse(doc,'instituteManagement',null);if(remote?.data&&Number(remote.updatedAt)>impaManagementRevision){impaManagementRevision=Number(remote.updatedAt);window.applyImpaManagementData(remote.data);await saveInstituteStudents(window.getImpaFirebaseStudents());console.info('IMPA Gestión actualizada desde Firebase')}else if(!remote){const data=window.getImpaManagementData();const envelope={updatedAt:Date.now(),data};impaManagementRevision=envelope.updatedAt;await Promise.all([saveInstituteManagement(envelope),saveInstituteStudents(window.getImpaFirebaseStudents())]);console.info('IMPA Gestión inicial guardada en Firebase')}}catch(err){console.warn('Gestión compartida no disponible:',err.message)}finally{impaManagementLoading=false}}
async function syncInstituteStudents(button=null){const status=document.querySelector('#firebaseSyncStatus'),students=window.getImpaFirebaseStudents();if(button){button.disabled=true;button.textContent='Sincronizando…'}try{await saveInstituteStudents(students);if(status){status.textContent=`Sincronización completa: ${Object.keys(students).length} alumnos con DNI disponibles para exámenes.`;status.className='notice'}console.info(`IMPA: ${Object.keys(students).length} alumnos sincronizados`)}catch(err){if(status){status.textContent='No se pudo sincronizar con Firestore: '+err.message;status.className='notice warning'}console.error(err)}finally{if(button){button.disabled=false;button.textContent='Sincronizar alumnos con Firebase'}}}
document.addEventListener('click',e=>{const button=e.target.closest('#syncFirebase');if(button)syncInstituteStudents(button)});
window.loadImpaAcademicData().catch(err=>console.warn('Resultados de exámenes no disponibles:',err.message));
loadImpaManagement();
setInterval(()=>{if(document.visibilityState==='visible')loadImpaManagement()},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadImpaManagement()});
function managementPinFingerprint(value){let hash=2166136261;for(const char of `IMPA-2026|${value}|DOCENTE`){hash^=char.charCodeAt(0);hash=Math.imul(hash,16777619)}return(hash>>>0).toString(36)}
const MANAGEMENT_PIN_HASH='1g5syba',managementDialog=document.querySelector('#managementLogin');
document.querySelectorAll('#managementAccess,.brand-access').forEach(button=>button.addEventListener('click',()=>managementDialog.showModal()));
document.querySelector('#closeManagementLogin').addEventListener('click',()=>managementDialog.close());
document.querySelector('#managementLoginForm').addEventListener('submit',event=>{event.preventDefault();const form=event.currentTarget,pin=String(new FormData(form).get('pin')||'');if(managementPinFingerprint(pin)!==MANAGEMENT_PIN_HASH){alert('Código incorrecto');form.reset();return}form.reset();managementDialog.close();document.querySelector('#managementGate').hidden=true;document.querySelector('#managementApp').classList.remove('locked')});
</script>
